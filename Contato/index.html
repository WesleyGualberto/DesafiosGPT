<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Entre em contato comigo</h1>
        <p>Entre em contato comigo para tirar duvidas sobre meus projetos e conversar um pouco comigo! Estou te aguardando</p>
    </header>
    <main>
        <div id="contato">
            <form class="formulario">
                <label for="nome">Nome:</label>
                <input class="foco" type="text" name="nome" id="nome" required placeholder="Digite seu nome">
                <label for="email">Email:</label>
                <input class="foco" type="email" name="email" id="email" required placeholder="Digite seu e-mail">
                <label for="assunto">Assunto:</label>
                <select class="foco" name="assunto" id="assunto">
                    <option value="duvida">Duvidas</option>
                    <option value="parceria">Parcerias</option>
                    <option value="freela">Freela</option>
                </select>
                <label for="mensagem">Mensagem:</label>
                <textarea class="foco" name="mensagem" id="mensagem" placeholder="Escreva sua mensagem aqui!"></textarea>
                <input class="enviar" type="button" value="Enviar">
            </form>
        </div>
    </main>
</body>
</html>
